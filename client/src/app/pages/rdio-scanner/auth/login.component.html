<div class="auth-page">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Sign In</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()">
                <mat-form-field appearance="fill">
                    <mat-label>Username</mat-label>
                    <input matInput formControlName="username" autocomplete="username" />
                </mat-form-field>

                <mat-form-field appearance="fill">
                    <mat-label>Password</mat-label>
                    <input matInput formControlName="password" type="password" autocomplete="current-password" />
                </mat-form-field>

                <button mat-flat-button color="primary" [disabled]="loading || form.invalid" type="submit">Login</button>
            </form>
        </mat-card-content>

        <mat-card-actions>
            <a mat-button routerLink="/register">Have an invite code? Create account</a>
            <button *ngIf="anonymousListening" mat-stroked-button color="accent" type="button" (click)="guestLogin()">
                Continue as Guest
            </button>
        </mat-card-actions>
    </mat-card>
</div>
